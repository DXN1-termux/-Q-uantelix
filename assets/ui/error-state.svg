<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <linearGradient id="xeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f85149" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="xeg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f85149" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Bracket icon broken -->
  <g stroke-width="3" fill="none" opacity="0.4">
    <path d="M45,20 L35,20 C32,20 30,22 30,25 L30,70 C30,73 32,75 35,75 L45,75" stroke="#f85149" opacity="0.6"/>
    <path d="M75,20 L85,20 C88,20 90,22 90,25 L90,70 C90,73 88,75 85,75 L75,75" stroke="#c084fc" opacity="0.6"/>
    <circle cx="60" cy="48" r="15" stroke="url(#xeg2)" stroke-width="3.5"/>
  </g>
  <!-- X marks -->
  <g stroke="#f85149" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="55" y1="43" x2="65" y2="53"/>
    <line x1="65" y1="43" x2="55" y2="53"/>
  </g>
  <!-- Broken lines -->
  <line x1="35" y1="95" x2="45" y2="95" stroke="#30363d" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="75" y1="95" x2="90" y2="95" stroke="#30363d" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="50" y1="105" x2="70" y2="105" stroke="#30363d" stroke-width="1" stroke-dasharray="2 4"/>
  <!-- Pulse ring -->
  <circle cx="60" cy="48" r="22" fill="none" stroke="#f85149" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="18;26;18" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
