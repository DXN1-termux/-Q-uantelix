<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Rotating ring -->
  <g transform="translate(40,40)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#21262d" stroke-width="4"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="url(#lg)" stroke-width="4"
      stroke-dasharray="39.27 157.08" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Center dot -->
  <circle cx="40" cy="40" r="4" fill="url(#lg)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
