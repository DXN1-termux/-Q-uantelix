<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.5" />

  <!-- Decorative gradient blobs -->
  <circle cx="200" cy="350" r="200" fill="#38bdf8" opacity="0.03" />
  <circle cx="1000" cy="50" r="250" fill="#a855f7" opacity="0.03" />
  <circle cx="600" cy="200" r="150" fill="#22d3ee" opacity="0.02" />

  <!-- Bracket Icon -->
  <g transform="translate(80, 100)" stroke-width="6" fill="none" filter="url(#glow)">
    <path d="M35,0 L10,0 C4,0 0,4 0,10 L0,150 C0,156 4,160 10,160 L35,160" stroke="#22d3ee" />
    <path d="M145,0 L170,0 C176,0 180,4 180,10 L180,150 C180,156 176,160 170,160 L145,160" stroke="#c084fc" transform="translate(180,80) scale(-1,1) translate(-180,-80)" />
    <circle cx="90" cy="80" r="50" stroke="url(#g1)" stroke-width="8" />
    <path d="M120,110 L150,140" stroke="url(#g1)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Text -->
  <g transform="translate(320, 160)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial">
    <text x="0" y="0" font-size="72" font-weight="800" fill="#e6edf3" letter-spacing="-2">
      [Q]uantelix
    </text>
    <text x="310" y="-40" font-size="18" fill="#8b949e" font-weight="500">TM</text>
    <text x="4" y="50" font-size="24" font-weight="600" fill="#8b949e" letter-spacing="4">
      AGENTIC AI. <tspan fill="url(#g2)" font-weight="700">INTELLIGENCE THAT ACTS.</tspan>
    </text>

    <!-- Tagline subtext -->
    <text x="4" y="85" font-size="14" fill="#484f58" letter-spacing="1">
      100M VIRTUAL CONTEXT · HIERARCHICAL MOE · PLUGIN MARKETPLACE
    </text>
  </g>

  <!-- Bottom accent line -->
  <rect x="320" y="270" width="560" height="2" fill="url(#g1)" rx="1" />
</svg>
